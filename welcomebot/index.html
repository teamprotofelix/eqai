<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안녕봇 • 내부망 이전 안내</title>
    <meta name="description" content="심사품질 안녕봇은 내부망으로 이전되었습니다. 공개망에서는 휴면 상태입니다.">
    <meta name="theme-color" content="#0a0a23">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00E5FF;
            --violet: #A78BFA;
            --bg: #05050f;
            --card: rgba(10, 14, 35, 0.92);
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', system-ui, sans-serif;
            background: radial-gradient(ellipse at 50% 20%, #12123a 0%, #05050f 55%, #000 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        #stars {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 920px;
            margin: 0 auto;
            padding: 28px 16px 40px;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .back {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.92rem;
            border: 1px solid rgba(0, 229, 255, 0.35);
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.35);
        }
        .back:hover { border-color: var(--cyan); background: rgba(0, 229, 255, 0.1); }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.82rem;
            font-weight: 800;
            padding: 0.4rem 0.85rem;
            border-radius: 999px;
            background: rgba(100, 116, 139, 0.35);
            border: 1px solid rgba(148, 163, 184, 0.45);
            color: #e2e8f0;
        }
        .status-pill i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
            box-shadow: 0 0 10px #94a3b8;
        }
        .logo-image {
            display: block;
            max-width: min(420px, 100%);
            width: auto;
            height: auto;
            margin: 0 auto 1rem;
            filter: drop-shadow(0 0 28px rgba(0, 229, 255, 0.45));
            border-radius: 16px;
        }
        .notice-banner {
            text-align: center;
            margin-bottom: 1rem;
            padding: 1rem 1.1rem;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.12), rgba(167, 139, 250, 0.1));
            border: 1px solid rgba(0, 229, 255, 0.28);
        }
        .notice-banner h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.15rem, 3.5vw, 1.55rem);
            margin-bottom: 0.45rem;
            background: linear-gradient(90deg, #67e8f9, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .notice-banner p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.55;
        }
        .chat-window {
            background: var(--card);
            border: 1px solid rgba(0, 229, 255, 0.32);
            border-radius: 24px;
            height: min(620px, calc(100vh - 280px));
            min-height: 420px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), 0 0 40px rgba(0, 229, 255, 0.08);
        }
        .chat-header {
            padding: 16px 20px;
            background: rgba(0, 229, 255, 0.07);
            border-bottom: 1px solid rgba(0, 229, 255, 0.22);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .pulse {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #94a3b8;
            box-shadow: 0 0 12px rgba(148, 163, 184, 0.8);
            flex-shrink: 0;
        }
        .chat-header strong { font-size: 1.05rem; }
        .chat-header .sub {
            font-size: 0.85rem;
            opacity: 0.8;
            color: #cbd5e1;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: 88%;
            padding: 14px 17px;
            border-radius: 18px;
            line-height: 1.65;
            font-size: 0.98rem;
            white-space: pre-wrap;
            word-break: keep-all;
        }
        .bot-message {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.28);
            align-self: flex-start;
        }
        .user-message {
            background: rgba(167, 139, 250, 0.14);
            border: 1px solid rgba(167, 139, 250, 0.38);
            align-self: flex-end;
        }
        .input-area {
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.45);
            border-top: 1px solid rgba(0, 229, 255, 0.18);
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 13px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(0, 229, 255, 0.28);
            border-radius: 50px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
        }
        #user-input:focus {
            border-color: rgba(0, 229, 255, 0.7);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.12);
        }
        #send-btn {
            padding: 13px 22px;
            background: linear-gradient(45deg, #00E5FF, #00B4D8);
            border: none;
            border-radius: 50px;
            color: #041016;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            font-family: inherit;
        }
        #send-btn:hover { filter: brightness(1.08); }
        .footer-note {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .footer-note a { color: var(--cyan); font-weight: 700; text-decoration: none; }
        .footer-note a:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            .chat-window {
                height: calc(100vh - 240px);
                min-height: 360px;
                border-radius: 18px;
            }
            .logo-image { max-width: 240px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="wrap">
        <div class="top-bar">
            <a class="back" href="https://eqai.moip.ai.kr/">← 서비스 허브</a>
            <span class="status-pill"><i aria-hidden="true"></i> 휴면 · 내부망 이전</span>
        </div>

        <img src="welcomebotlogo.jpg" alt="안녕봇" class="logo-image" width="420" height="auto" decoding="async"
             onerror="this.style.display='none'">

        <div class="notice-banner">
            <h1>Welcome Bot · 휴면 안내</h1>
            <p>
                공개 웹의 안녕봇 서비스는 종료되었습니다.<br>
                실제 대화는 <strong style="color:#67e8f9">내부망 안녕봇</strong>에서 이용해 주세요.
            </p>
        </div>

        <div class="chat-window" role="region" aria-label="안녕봇 안내 채팅">
            <div class="chat-header">
                <div class="pulse" aria-hidden="true"></div>
                <div>
                    <strong>안녕봇</strong>
                    <span class="sub">— 내부망 이전</span>
                </div>
            </div>

            <div id="chat-messages" class="chat-messages" aria-live="polite"></div>

            <div class="input-area">
                <label for="user-input" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">메시지 입력</label>
                <input type="text" id="user-input" placeholder="메시지를 입력하면 내부망 이용 안내가 표시됩니다" autocomplete="off">
                <button type="button" id="send-btn">전송</button>
            </div>
        </div>

        <p class="footer-note">
            심사품질연구회 AI센터 · 공개망 휴면 페이지<br>
            <a href="https://eqai.moip.ai.kr/">서비스 허브로 돌아가기</a>
        </p>
    </div>

    <script>
        (function () {
            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const canvas = document.getElementById('stars');
            const ctx = canvas.getContext('2d');
            let stars = [];
            let running = true;
            let raf = 0;

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.floor(innerWidth * dpr);
                canvas.height = Math.floor(innerHeight * dpr);
                canvas.style.width = innerWidth + 'px';
                canvas.style.height = innerHeight + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const n = Math.min(120, Math.floor((innerWidth * innerHeight) / 14000));
                stars = [];
                for (let i = 0; i < n; i++) {
                    stars.push({
                        x: Math.random() * innerWidth,
                        y: Math.random() * innerHeight,
                        r: Math.random() * 1.5 + 0.3,
                        a: Math.random() * 0.5 + 0.3,
                        p: Math.random() * Math.PI * 2,
                        s: Math.random() * 0.02 + 0.008
                    });
                }
            }

            function draw(t) {
                if (!running) return;
                ctx.clearRect(0, 0, innerWidth, innerHeight);
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    const a = s.a + Math.sin(t * s.s + s.p) * 0.3;
                    ctx.beginPath();
                    ctx.fillStyle = 'rgba(186,230,253,' + Math.max(0.12, a) + ')';
                    ctx.shadowColor = 'rgba(0,229,255,0.5)';
                    ctx.shadowBlur = 6;
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                if (!reduced) raf = requestAnimationFrame(draw);
            }

            resize();
            if (reduced) draw(0); else raf = requestAnimationFrame(draw);
            addEventListener('resize', resize);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    running = false;
                    if (raf) cancelAnimationFrame(raf);
                } else if (!reduced) {
                    running = true;
                    raf = requestAnimationFrame(draw);
                }
            });

            const chatMessages = document.getElementById('chat-messages');
            const input = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');

            const REPLY =
                '내부망으로 이사했어요. 거기서 만나요~\n\n' +
                '공개 웹의 안녕봇 채팅은 휴면 상태입니다.\n' +
                '실제 대화·업무 지원은 내부망에 배포된 안녕봇을 이용해 주세요.';

            function addMessage(content, isUser) {
                const el = document.createElement('div');
                el.className = 'message ' + (isUser ? 'user-message' : 'bot-message');
                el.textContent = content;
                chatMessages.appendChild(el);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function sendMessage() {
                const text = (input.value || '').trim();
                if (!text) return;
                addMessage(text, true);
                input.value = '';
                setTimeout(function () {
                    addMessage(REPLY, false);
                }, 380);
            }

            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            setTimeout(function () {
                addMessage(
                    '직원님, 안녕하세요.\n' +
                    '안녕봇은 내부망으로 이전되었습니다.\n\n' +
                    '이 페이지는 공개망 안내 전용이며, 실시간 AI 대화는 제공하지 않습니다.\n' +
                    '메시지를 보내시면 내부망 이용 안내를 다시 알려 드릴게요.',
                    false
                );
            }, 450);
        })();
    </script>
</body>
</html>
