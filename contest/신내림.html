<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신내림 로또 봇 - 꿈으로 번호 맞추기 (서버 프록시 보안 버전)</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e3c72, #2a5298); 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { 
            font-size: 2.5em; 
            background: linear-gradient(90deg, #ffd700, #ffed4e); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin: 0; 
            text-shadow: 0 0 20px rgba(255,215,0,0.5); 
        }
        .warning { 
            background: linear-gradient(135deg, #00d4ff, #0099cc); 
            color: #fff; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            font-weight: bold; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,212,255,0.3);
        }
        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            background: rgba(0,0,0,0.2); 
            border-radius: 10px; 
            padding: 20px; 
            margin-bottom: 20px; 
        }
        .message { 
            margin-bottom: 15px; 
            padding: 12px; 
            border-radius: 18px; 
            max-width: 80%; 
            word-wrap: break-word; 
        }
        .bot { 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            margin-left: 20%; 
        }
        .user { 
            background: linear-gradient(135deg, #f093fb, #f5576c); 
            margin-right: 20%; 
            color: #fff; 
        }
        .loading { 
            background: linear-gradient(135deg, #ffd700, #ffed4e); 
            margin-left: 20%; 
            color: #333; 
            font-style: italic; 
        }
        .input-section { display: flex; gap: 10px; }
        input[type="text"] { 
            flex: 1; 
            padding: 15px; 
            border: none; 
            border-radius: 25px; 
            background: rgba(255,255,255,0.9); 
            font-size: 16px; 
        }
        button { 
            padding: 15px 25px; 
            background: linear-gradient(135deg, #ffd700, #ffed4e); 
            border: none; 
            border-radius: 25px; 
            color: #333; 
            font-weight: bold; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .section { 
            background: rgba(255,255,255,0.2); 
            padding: 8px; 
            border-radius: 5px; 
            margin: 5px 0; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧙‍♂️ 신내림 로또 봇</h1>
        <p>어제 밤 꿈을 말해주세요. 신이 내린 번호를 추천해드립니다! (로또 6/45)</p>
    </div>

    <div class="warning">
        🔒 <strong>서버 프록시 보안 모드</strong>: API 키 서버에서만 사용 (클라이언트 노출 ZERO). 안전하게 꿈해몽 받으세요!
    </div>

    <div id="chat-container"></div>

    <div class="input-section">
        <input type="text" id="userInput" placeholder="어제 밤 꿈 이야기를 자세히 말씀해주세요... (예: '물에 빠졌다가 헤엄쳐 나옴')" />
        <button id="sendBtn" onclick="sendMessage()">전송</button>
    </div>

    <script>
        const SYSTEM_PROMPT = `너의 이름은 '신내림 로또 봇'이다. 로또 6/45 번호(1~45 중 6개)를 맞추는 챗봇이다. 모델: grok-beta.

사용자에게 "대화창에 어제 밤 꿈 이야기를 입력하세요"라고 유도한다.

응답 형식은 반드시:
[꿈해몽]
(성의있고 설득력 있게: 한국 전통 꿈해몽(물=재물/6,15,24; 뱀=변화/3,12,33; 하늘=행운/1,7,45 등 500+ DB 총망라), 프로이트 심리, 융 원형, 문화 상징, 로또 통계 연계. 꿈 키워드 벡터화: 긍정=상승수, 부정=변화수 → 숫자 추천 근거 설명.)

[로또번호 추천]
추천번호: 01, 05, 12, 23, 34, 45 (벡터화 설명 + 보너스 1개 + 확률 근거)

꿈해몽은 모든 DB(전통서·현대 사이트·심리학)를 총망라해 깊고 설득력 있게. 번호는 꿈 벡터로 생성(랜덤+가중).`;

        function addMessage(sender, text, isLoading = false) {
            const container = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `message ${sender} ${isLoading ? 'loading' : ''}`;
            msg.innerHTML = text.replace(/\n/g, '<br>');
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const userText = input.value.trim();
            if (!userText) return;

            addMessage('user', userText);
            input.value = '';
            sendBtn.disabled = true;
            addMessage('bot', '🧙‍♂️ 신내림 중... (서버 API 호출)', true);

            try {
                const response = await fetch('/api/grok', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: 'system', content: SYSTEM_PROMPT },
                            { role: 'user', content: userText }
                        ],
                        model: 'grok-4.20-0309-non-reasoning',  // 서버에서 지원
                        temperature: 0.7,
                        max_tokens: 15000
                    })
                });

                if (!response.ok) throw new Error(`서버 오류: ${response.status}`);

                const data = await response.json();
                const botText = data.choices[0].message.content;

                // 파싱 (섹션 강조)
                const parsed = botText
                    .replace(/\[꿈해몽\]/gi, '<div class="section">[꿈해몽]</div>')
                    .replace(/\[로또번호 추천\]/gi, '<div class="section">[로또번호 추천]</div>');

                // 로딩 메시지 교체
                document.querySelector('.loading').outerHTML = `<div class="message bot">${parsed}</div>`;
            } catch (error) {
                addMessage('bot', `❌ 오류: ${error.message}. 서버 확인 (http://localhost:3005/health)`);
            } finally {
                sendBtn.disabled = false;
            }
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        window.onload = () => {
            addMessage('bot', '<div class="section">[환영]</div>🧙‍♂️ 신내림 로또 봇 준비 완료! 서버 프록시로 안전하게 작동 중. 어제 밤 꿈 이야기 말씀해주세요.');
        };
    </script>
</body>
</html>
